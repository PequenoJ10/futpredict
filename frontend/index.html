<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FutPredict AI</title>
    <style>
        body {
            background-color: #0b0f19;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 { font-size: 2rem; margin-bottom: 5px; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            align-items: center;
            margin-bottom: 30px;
        }
        select, .sync-btn {
            background-color: #1e293b;
            color: white;
            border: 1px solid #334155;
            padding: 10px 15px;
            font-size: 0.9rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .sync-btn {
            background-color: #059669;
            border: none;
            font-weight: bold;
        }
        .sync-btn:hover { background-color: #047857; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 20px;
            text-align: left;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .teams-title {
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            color: #f3f4f6;
        }
        .pred-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .pred-btn:hover { background-color: #1d4ed8; }
        .result-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            font-size: 0.85rem;
            border: 1px solid #1f2937;
        }
    </style>
</head>
<body>

    <h1>FutPredict AI ⚽</h1>
    <div class="subtitle">Predicciones estadísticas basadas en Poisson y Realidad</div>

    <div class="controls">
        <select id="league-select">
            <option value="PD">La Liga (España)</option>
            <option value="PL">Premier League (Inglaterra)</option>
            <option value="SA">Serie A (Italia)</option>
            <option value="CL">Champions League</option>
        </select>
        <button class="sync-btn" onclick="syncMatches()">🔄 Sincronizar Fixture Real</button>
    </div>

    <div class="grid" id="matches-container">
        <p style="grid-column: 1/-1; color: #94a3b8;">Cargando partidos...</p>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        async function loadMatches() {
            const container = document.getElementById('matches-container');
            try {
                const res = await fetch(`${API_URL}/api/matches/`);
                if (!res.ok) throw new Error("Error al cargar partidos");
                
                const matches = await res.json();
                
                if (!matches || matches.length === 0) {
                    container.innerHTML = `<p style="grid-column: 1/-1; color:#94a3b8;">No hay partidos cargados. Sincroniza arriba.</p>`;
                    return;
                }

                container.innerHTML = matches.map((m, index) => {
                    const home = m.home_team;
                    const away = m.away_team;
                    const dateFormatted = new Date(m.match_date || m.date).toLocaleString();

                    return `
                        <div class="card">
                            <div class="card-header">
                                <span>📅 ${dateFormatted}</span>
                                <span>Estado: ${m.status}</span>
                            </div>
                            <div class="teams-title">${home} vs ${away}</div>
                            <button class="pred-btn" onclick="generatePrediction('${home}', '${away}', ${index})">Generar Predicción</button>
                            <div id="prediction-${index}"></div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
                container.innerHTML = `<p style="grid-column: 1/-1; color:#ef4444;">Error conectando con el servidor.</p>`;
            }
        }

        async function syncMatches() {
            const leagueCode = document.getElementById('league-select').value;
            try {
                const res = await fetch(`${API_URL}/api/matches/sync?league_code=${leagueCode}`, { method: 'POST' });
                if (!res.ok) throw new Error("Error en sincronización");
                
                alert(`Sincronizados partidos con éxito.`);
                loadMatches();
            } catch (err) {
                console.error(err);
                alert("Error al sincronizar partidos.");
            }
        }

        async function generatePrediction(home, away, index) {
            const container = document.getElementById(`prediction-${index}`);
            container.innerHTML = `<div class="result-box" style="text-align:center; color:#38bdf8;">Calculando modelo real...</div>`;

            try {
                const res = await fetch(`${API_URL}/predictions/?home_team=${encodeURIComponent(home)}&away_team=${encodeURIComponent(away)}`, {
                    method: 'POST'
                });

                if (!res.ok) throw new Error("Error en el cálculo");

                const data = await res.json();

                container.innerHTML = `
                    <div class="result-box">
                        <p style="color: #4ade80; font-weight: bold; margin-top:0;">🎯 ${data.prediction}</p>
                        <p style="margin: 5px 0;"><strong>Goles Esperados (xG):</strong> ${data.expected_home_goals} - ${data.expected_away_goals}</p>
                        <p style="margin: 0; font-size: 0.8rem; color: #94a3b8;">Probabilidades: Local (${data.home_win_probability}%) | Empate (${data.draw_probability}%) | Visita (${data.away_win_probability}%)</p>
                    </div>
                `;
            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="result-box" style="color:#ef4444;">Error al calcular predicción.</div>`;
            }
        }

        loadMatches();
    </script>
</body>
</html>
